[project]
name = "telemachus-linux"
version = "0.1.0"
description = "Linux receiver for the Telemachus Mac display host"
requires-python = ">=3.10"
dependencies = ["pysdl2>=0.9.17,<0.10"]

[dependency-groups]
dev = ["pytest>=9.2.0", "pytest-subtests>=0.15.0", "ruff>=0.17.3"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff.lint]
select = ["F", "E9"]
